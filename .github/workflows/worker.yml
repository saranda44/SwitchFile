name: Worker CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  push:
    branches: [dev, main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'

jobs:
  build:
    name: worker-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 worker via SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          set -e
          INSTANCE_ID="${{ secrets.EC2_WORKER_INSTANCE_ID }}"

          # SSM RunShellScript: pull, install, build, restart service
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD worker deploy ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters '{"commands":[
              "set -e",
              "cd /opt/switchfile-worker",
              "sudo -u ec2-user git fetch origin",
              "sudo -u ec2-user git reset --hard origin/main",
              "cd worker",
              "sudo -u ec2-user npm install",
              "sudo -u ec2-user npm run build",
              "sudo systemctl restart switchfile-worker.service",
              "sleep 3",
              "sudo systemctl is-active switchfile-worker.service"
            ]}' \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $CMD_ID"

          # Poll hasta estado terminal (max 5 min)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status = $STATUS"
            case "$STATUS" in
              Success)
                echo "✓ Worker desplegado en $INSTANCE_ID"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "✗ Deploy falló con estado $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "✗ Deploy no terminó en 5 minutos"
          exit 1
